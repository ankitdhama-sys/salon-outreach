<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bewtee Salon Tracker</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17233c;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#19336b;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:20px;margin:0}main{max-width:1150px;margin:auto;padding:22px}button,.btn{border:0;background:#2b69f6;color:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:600}button.secondary{background:#e9efff;color:#2453b9}button.danger{background:#fff0f0;color:#b42318}button:disabled{opacity:.5}input,select,textarea{width:100%;padding:11px;border:1px solid #d7dfed;border-radius:9px;background:white;font:inherit}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}.panel{background:white;border:1px solid #e0e7f1;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 2px 9px #20375d0b}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:320px}.toolbar select{max-width:175px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;padding:18px;border-radius:12px;border:1px solid #e0e7f1}.stat b{font-size:27px;display:block;color:#2b69f6}.stat span{font-size:13px;color:#65728a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:#fff;color:#17233c;border:1px solid #e0e7f1;padding:15px;width:100%}.item:hover{border-color:#2b69f6}.muted{color:#65728a;font-size:13px}.pill{font-size:12px;background:#edf2ff;color:#2453b9;padding:5px 9px;border-radius:99px}.hidden{display:none!important}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.checks label{border:1px solid #d7dfed;border-radius:9px;padding:12px;margin:0;display:flex;align-items:center;gap:9px}.checks input{width:auto}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos img{width:100px;height:100px;object-fit:cover;border-radius:9px}.photo{position:relative}.photo button{position:absolute;right:0;top:0;padding:4px 8px}.link{color:#2b69f6}#message{min-height:24px;color:#2453b9}#login{max-width:400px;margin:12vh auto}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sectionhead h2{margin:0 0 14px}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button.active{background:#19336b}small{color:#65728a}@media(max-width:680px){main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.grid,.checks{grid-template-columns:1fr}.toolbar input,.toolbar select{max-width:none}.toolbar>*{flex:1 1 130px}}
</style></head><body>
<header><h1>✦ Bewtee Salon Tracker</h1></header>
<main>
<div id="app"><div id="message"></div><section id="listPage"><div class="stats" id="stats"></div><div class="panel" style="margin-top:16px"><div class="sectionhead"><h2>Salon outreach</h2><button id="add">+ Add salon</button></div><div class="toolbar"><input id="search" placeholder="Search salon, area, phone…"><select id="typeFilter"><option value="">All types</option><option>A</option><option>B</option><option>C</option><option>Needs verification</option><option>Outside criteria</option></select><button id="export" class="secondary">Export CSV</button><label class="secondary btn" style="margin:0">Import Excel<input id="import" type="file" accept=".xlsx" hidden></label></div><div class="tabs"><button data-tab="first" class="active">First visit</button><button data-tab="revisit" class="secondary">Revisit / completed</button><button data-tab="all" class="secondary">All salons</button></div><div id="list" class="list"></div></div></section>
<section id="detail" class="hidden"><div class="sectionhead"><button id="back" class="secondary">← Back to list</button><button id="delete" class="danger">Delete salon</button></div><div class="panel" style="margin-top:15px"><h2 id="detailTitle">Salon</h2><p id="next" class="pill"></p><form id="editForm"><div class="grid"><div><label>Salon name *</label><input name="name" required></div><div><label>Area</label><input name="area"></div><div><label>Phone</label><input name="phone" type="tel"></div><div><label>Google reviews</label><input name="reviews" type="number" min="0"></div><div><label>Instagram followers</label><input name="followers" type="number" min="0"></div><div><label>Review-based candidate</label><input name="candidate"></div><div><label>Final type (calculated)</label><input id="finalType" disabled></div><div><label>Outreach status</label><select name="outreach"><option>Not contacted</option><option>Contacted</option><option>Follow-up</option><option>Interested</option><option>Not interested</option><option>Converted</option></select></div><div><label>Salon status</label><select name="status"><option>New</option><option>Contacted</option><option>Interested</option><option>Follow-up</option><option>Paid</option><option>Not interested</option></select></div><div><label>Google Maps URL</label><input name="maps" type="url"></div></div><label>Checklist</label><div class="checks"><label><input type="checkbox" name="visit"> 1. Visited salon</label><label><input type="checkbox" name="profile"> 2. Bewtee profile created</label><label><input type="checkbox" name="paid"> 3. Paid account</label><label><input type="checkbox" name="print"> 4. Printed material placed</label></div><label>Response score: <b id="score">0</b></label><input name="resp" type="range" min="-5" max="5" value="0"><small>−5 Negative · 0 Neutral · +5 Positive</small><label>Notes</label><textarea name="notes" rows="4"></textarea><label>Updated by</label><input name="by_user" value="Admin"><div class="toolbar" style="margin-top:18px"><button type="submit">Save changes</button><a id="mapsLink" class="link" target="_blank" rel="noopener noreferrer">Open Google Maps</a></div></form></div><div class="panel" id="photoPanel"><h3>Printed material photo proof</h3><div id="photos" class="photos"></div><label>Upload image (max 12 MB)</label><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div></section></div></main>
<script>
let salons=[],selected=null,tab='first';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){let r=await fetch('/api'+path,options);let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data}
function notify(s){$('message').textContent=s;setTimeout(()=>$('message').textContent='',4500)}
async function start(){try{await refresh()}catch(e){notify(e.message)}}
function done(s){return s.visit&&s.profile&&s.paid&&s.print}function next(s){return !s.visit?'Visit the salon':!s.profile?'Revisit: create Bewtee profile':!s.paid?'Call salon for paid account':!s.print?'Revisit: place printed material':'✓ All done'}
function type(s){let a=s.reviews,b=s.followers;if(a===null||a===undefined||b===null||b===undefined)return 'Needs verification';if(a<100&&b<100)return 'C';if(a<500&&b<500)return 'B';if(a<1000&&b<1000)return 'A';return 'Outside criteria'}
async function refresh(){salons=await api('/salons');render()}
function render(){let first=salons.filter(s=>!s.visit).length,revisit=salons.filter(s=>s.visit&&!done(s)).length,completed=salons.filter(done).length;$('stats').innerHTML=[[salons.length,'Total salons'],[first,'First visits'],[revisit,'Revisits pending'],[completed,'Completed']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');let q=$('search').value.toLowerCase(),t=$('typeFilter').value;let rows=salons.filter(s=>(tab==='all'||(tab==='first'?!s.visit:!!s.visit))&&(!t||type(s)===t)&&[s.name,s.area,s.phone].join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(s=>`<button class="item" data-id="${s.id}"><span><strong>${esc(s.name)}</strong><br><span class="muted">${esc(s.area)} · ${esc(s.phone||'No phone')} · ${esc(next(s))}</span></span><span class="pill">${esc(type(s))} · ${esc(s.status)}</span></button>`).join(''):'<p class="muted">No salons match this filter.</p>'}
$('list').onclick=e=>{let b=e.target.closest('[data-id]');if(b)openSalon(Number(b.dataset.id))};$('search').oninput=render;$('typeFilter').onchange=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
function formData(){let f=$('editForm'),d={};for(let k of ['name','area','phone','candidate','outreach','maps','notes','status','by_user'])d[k]=f.elements[k].value;for(let k of ['reviews','followers'])d[k]=f.elements[k].value===''?null:Number(f.elements[k].value);for(let k of ['visit','profile','paid','print'])d[k]=f.elements[k].checked;d.resp=Number(f.elements.resp.value);return d}
function updatePreview(){let d=formData();$('score').textContent=d.resp>0?'+'+d.resp:d.resp;$('next').textContent=next(d);$('finalType').value=type(d)}
$('editForm').oninput=updatePreview;
function openSalon(id){selected=id;let s=salons.find(x=>x.id===id)||{name:'',area:'',phone:'',reviews:null,followers:null,candidate:'',outreach:'Not contacted',maps:'',notes:'',status:'New',visit:0,profile:0,paid:0,print:0,resp:0,by_user:'Admin',photos:[]};$('detailTitle').textContent=id?s.name:'Add new salon';let f=$('editForm');for(let k of ['name','area','phone','candidate','outreach','maps','notes','status','by_user','reviews','followers','resp'])f.elements[k].value=s[k]??'';for(let k of ['visit','profile','paid','print'])f.elements[k].checked=!!s[k];$('delete').classList.toggle('hidden',!id);$('photoPanel').classList.toggle('hidden',!id);$('mapsLink').classList.toggle('hidden',!s.maps);if(s.maps)$('mapsLink').href=s.maps;drawPhotos(s.photos);updatePreview();$('listPage').classList.add('hidden');$('detail').classList.remove('hidden');window.scrollTo(0,0)}
function drawPhotos(ps=[]){$('photos').innerHTML=ps.map(p=>`<div class="photo"><img src="${p.url}" alt="Photo proof"><button class="danger" data-photo="${p.id}">×</button></div>`).join('')}
$('photos').onclick=async e=>{let b=e.target.closest('[data-photo]');if(!b)return;if(!confirm('Remove photo?'))return;try{await api('/photos/'+b.dataset.photo,{method:'DELETE'});await refresh();openSalon(selected)}catch(err){notify(err.message)}};
$('back').onclick=()=>{$('detail').classList.add('hidden');$('listPage').classList.remove('hidden')};$('add').onclick=()=>openSalon(null);
$('editForm').onsubmit=async e=>{e.preventDefault();try{let id=selected,d=formData();let result=await api(id?'/salons/'+id:'/salons',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});await refresh();openSalon(id||result.id);notify('Saved successfully')}catch(err){notify(err.message)}};
$('delete').onclick=async()=>{if(!selected||!confirm('Permanently delete this salon and its photos?'))return;try{await api('/salons/'+selected,{method:'DELETE'});await refresh();$('back').click();notify('Salon deleted')}catch(err){notify(err.message)}};
$('photoInput').onchange=async e=>{let file=e.target.files[0];if(!file||!selected)return;let fd=new FormData();fd.append('photo',file);try{await api('/salons/'+selected+'/photos',{method:'POST',body:fd});await refresh();openSalon(selected);notify('Photo uploaded')}catch(err){notify(err.message)}e.target.value=''};
$('export').onclick=()=>window.location.href='/api/export';$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;let fd=new FormData();fd.append('file',file);try{let r=await api('/import',{method:'POST',body:fd});await refresh();notify(`Imported ${r.imported} salons; skipped ${r.skipped} duplicates/invalid rows`)}catch(err){notify(err.message)}e.target.value=''};start();
</script></body></html>
